name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle & Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Warm Gradle cache (resolve plugins/dependencies)
        run: ./gradlew --no-daemon --refresh-dependencies help --warning-mode=all

      - name: Build (assembleDebug)
        run: ./gradlew --no-daemon assembleDebug --warning-mode=all

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/**/*.apk

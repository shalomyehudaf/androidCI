# Android CI - pre-download Gradle distribution to avoid wrapper network timeouts,
# find the gradle wrapper anywhere, run build from its directory, and upload artifacts.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle & Maven
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show repo layout (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "Find gradle-wrapper.properties and gradlew (if present):"
          find . -maxdepth 6 -type f -name gradle-wrapper.properties -print || true
          find . -maxdepth 6 -type f -name gradlew -print || true

      - name: Pre-download Gradle distribution (download+unpack into wrapper cache)
        run: |
          set -euo pipefail
          WRAPPER_PROPS=$(find . -type f -name gradle-wrapper.properties | head -n 1 || true)
          if [ -z "$WRAPPER_PROPS" ]; then
            echo "No gradle-wrapper.properties found. Ensure gradle/wrapper/gradle-wrapper.properties is committed."
            exit 0
          fi
          echo "Using wrapper properties: $WRAPPER_PROPS"
          DIST_URL=$(grep -E '^distributionUrl=' "$WRAPPER_PROPS" | cut -d= -f2-)
          if [ -z "$DIST_URL" ]; then
            echo "Could not determine distributionUrl from $WRAPPER_PROPS"
            exit 1
          fi
          echo "Original distributionUrl: $DIST_URL"
          # Prefer direct downloads.gradle.org CDN to avoid services.gradle.org redirect timeouts
          DIST_URL=${DIST_URL/services.gradle.org/downloads.gradle.org}
          echo "Resolved distributionUrl: $DIST_URL"
          DIST_NAME=$(basename "$DIST_URL")
          BASE_NAME=${DIST_NAME%.zip}   # e.g. gradle-9.5.0-bin
          GRADLE_USER_HOME="${HOME}/.gradle"
          DEST_DIR="$GRADLE_USER_HOME/wrapper/dists/$BASE_NAME/ci"
          mkdir -p "$DEST_DIR"
          echo "Downloading $DIST_URL to /tmp/$DIST_NAME"
          # robust curl with retries
          curl -fL --retry 8 --retry-delay 10 --retry-max-time 600 -o "/tmp/$DIST_NAME" "$DIST_URL"
          echo "Unpacking into $DEST_DIR"
          unzip -q "/tmp/$DIST_NAME" -d "$DEST_DIR"
          rm -f "/tmp/$DIST_NAME"
          echo "Contents of $DEST_DIR:"
          ls -la "$DEST_DIR"

      - name: Find gradlew, make executable and run build (with retries)
        run: |
          set -euo pipefail
          GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1 || true)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found in repository. Please commit gradlew, gradlew.bat and gradle/wrapper/*."
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLEW_DIR"
          attempts=0
          max_attempts=3
          until [ $attempts -ge $max_attempts ]
          do
            attempts=$((attempts+1))
            echo "Build attempt $attempts/$max_attempts..."
            if [ $attempts -lt $max_attempts ]; then
              ./gradlew --no-daemon assembleDebug --warning-mode=all && break || true
            else
              echo "Final attempt: running with --stacktrace --info for diagnostics"
              ./gradlew --no-daemon assembleDebug --stacktrace --info || exit 1
            fi
            echo "Attempt $attempts failed; sleeping $((attempts * 10))s before retry..."
            sleep $((attempts * 10))
          done

      - name: Upload debug APKs (if any)
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: |
            **/build/outputs/**/*.apk

      - name: Upload Gradle logs (always)
        if: always()
        run: |
          echo "Collecting Gradle logs (if present)..."
          find . -type f -name "*.log" -maxdepth 6 -print || true

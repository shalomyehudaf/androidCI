name: Android CI

on:push:pull_request:workflow_dispatch:

jobs:build:runs-on:ubuntu-latest env:http_proxy:"https_proxy:"HTTP_PROXY:"HTTPS_PROXY:"

steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Set up JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Cache Gradle & Maven
    uses: actions/cache@v5
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
        ~/.m2/repository
      key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', 'gradle/libs.versions.toml') }}
      restore-keys: |
        ${{ runner.os }}-gradle-

  - name: Show repo layout (debug)
    run: |
      echo "PWD: $(pwd)"
      ls -la
      echo "Searching for gradlew..."
      find . -maxdepth 6 -type f -name gradlew -print || true

  - name: Make/find gradlew and run build (with retries)
    run: |
      set -euo pipefail
      GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1 || true)
      if [ -z "$GRADLEW_PATH" ]; then
        echo "gradlew not found. Commit the Gradle wrapper (gradlew, gradlew.bat, gradle/wrapper/*)."
        ls -la
        exit 1
      fi
      chmod +x "$GRADLEW_PATH"
      GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
      cd "$GRADLEW_DIR"
      attempts=0
      max_attempts=3
      while [ $attempts -lt $max_attempts ]; do
        attempts=$((attempts+1))
        echo "Build attempt $attempts/$max_attempts"
        if [ $attempts -lt $max_attempts ]; then
          ./gradlew --no-daemon assembleDebug --warning-mode=all && break || true
        else
          echo "Final attempt with diagnostics (--stacktrace --info)"
          ./gradlew --no-daemon assembleDebug --stacktrace --info || exit 1
        fi
        sleep $((attempts * 10))
      done

  - name: Upload debug APKs (if any)
    uses: actions/upload-artifact@v5
    with:
      name: apks
      path: |
        **/build/outputs/**/*.apk

  - name: Upload Gradle logs (always)
    if: always()
    run: |
      echo "Collecting Gradle logs (if present)..."
      find . -type f -name "*.log" -maxdepth 6 -print || true

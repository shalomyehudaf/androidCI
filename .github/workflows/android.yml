name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle & Maven
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show repo layout (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "Find gradle-wrapper.properties and gradlew (if present):"
          find . -maxdepth 6 -type f -name gradle-wrapper.properties -print || true
          find . -maxdepth 6 -type f -name gradlew -print || true

      - name: Pre-download Gradle distribution (download to /tmp and update wrapper to use file:///)
        run: |
          set -euo pipefail
          # If you provided a GRADLE_DIST_URL secret, prefer that (release asset)
          if [ -n "${{ secrets.GRADLE_DIST_URL || '' }}" ]; then
            DIST_URL="${{ secrets.GRADLE_DIST_URL }}"
            echo "Using GRADLE_DIST_URL from secrets: $DIST_URL"
          else
            WRAPPER_PROPS=$(find . -type f -name gradle-wrapper.properties | head -n 1 || true)
            if [ -z "$WRAPPER_PROPS" ]; then
              echo "No gradle-wrapper.properties found; skipping pre-download (wrapper will attempt download)."
              exit 0
            fi
            DIST_URL=$(grep -E '^distributionUrl=' "$WRAPPER_PROPS" | cut -d= -f2-)
            if [ -z "$DIST_URL" ]; then
              echo "distributionUrl not found in $WRAPPER_PROPS; skipping pre-download."
              exit 0
            fi
            # prefer the direct downloads.gradle.org CDN to avoid redirect timeouts
            DIST_URL=${DIST_URL/services.gradle.org/downloads.gradle.org}
            echo "Using distributionUrl from wrapper: $DIST_URL"
          fi

          DIST_NAME=$(basename "$DIST_URL")
          TMP_ZIP="/tmp/${DIST_NAME}"
          echo "Downloading $DIST_URL to $TMP_ZIP"

          # robust curl with connect timeout and retries
          curl -fL --connect-timeout 30 --max-time 1200 --retry 8 --retry-delay 10 -o "$TMP_ZIP" "$DIST_URL"

          # Optional: compute SHA and unpack into the wrapper cache so it's available for other processes
          echo "Computing SHA256 for zip to create deterministic wrapper cache subdir..."
          ZIP_SHA=$(sha256sum "$TMP_ZIP" | awk '{print $1}')
          BASE_NAME=${DIST_NAME%.zip}   # e.g. gradle-9.5.0-bin
          GRADLE_USER_HOME="${HOME}/.gradle"
          DEST_DIR="$GRADLE_USER_HOME/wrapper/dists/$BASE_NAME/$ZIP_SHA"
          mkdir -p "$DEST_DIR"
          echo "Unpacking $TMP_ZIP -> $DEST_DIR"
          unzip -q "$TMP_ZIP" -d "$DEST_DIR" || true
          echo "Unpacked. Contents (if any):"
          ls -la "$DEST_DIR" || true

          # Update the workspace gradle-wrapper.properties to point at the local file URL so the wrapper won't try to fetch network
          WRAPPER_PROPS_LOCAL=$(find . -type f -name gradle-wrapper.properties | head -n 1 || true)
          if [ -n "$WRAPPER_PROPS_LOCAL" ]; then
            echo "Adjusting distributionUrl in $WRAPPER_PROPS_LOCAL to point to file://$TMP_ZIP (workspace only)"
            # Escape slashes for sed; use temp file to avoid BSD/GNU sed portability issues
            awk -v new="distributionUrl=file://$TMP_ZIP" 'BEGIN{changed=0} /^distributionUrl=/ {print new; changed=1; next} {print} END{if(changed==0) print new}' "$WRAPPER_PROPS_LOCAL" > "$WRAPPER_PROPS_LOCAL.tmp" && mv "$WRAPPER_PROPS_LOCAL.tmp" "$WRAPPER_PROPS_LOCAL"
            echo "Updated gradle-wrapper.properties (workspace):"
            grep -E '^distributionUrl=' "$WRAPPER_PROPS_LOCAL" || true
          else
            echo "No local gradle-wrapper.properties found to patch."
          fi

      - name: Activate pre-downloaded Gradle and verify (runs wrapper against local file)
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="${HOME}/.gradle"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"
          echo "Wrapper dists:"
          ls -la "$GRADLE_USER_HOME/wrapper/dists" || true
          echo "Find distribution directories:"
          find "$GRADLE_USER_HOME/wrapper/dists" -maxdepth 3 -type d -print || true

          GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1 || true)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found in repo; nothing to run here."
            exit 0
          fi
          chmod +x "$GRADLEW_PATH"
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          echo "Running wrapper verification from: $GRADLEW_DIR"
          cd "$GRADLEW_DIR"

          # Running --version should now read the local file:// zip set above and not attempt a network fetch.
          ./gradlew --no-daemon --version --warning-mode=all

      - name: Find gradlew, make executable and run build (with retries)
        run: |
          set -euo pipefail
          GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1 || true)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found in repository. Please commit gradlew, gradlew.bat and gradle/wrapper/*."
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLEW_DIR"
          attempts=0
          max_attempts=3
          until [ $attempts -ge $max_attempts ]
          do
            attempts=$((attempts+1))
            echo "Build attempt $attempts/$max_attempts..."
            if [ $attempts -lt $max_attempts ]; then
              ./gradlew --no-daemon assembleDebug --warning-mode=all && break || true
            else
              echo "Final attempt: running with --stacktrace and --info for diagnostics"
              ./gradlew --no-daemon assembleDebug --stacktrace --info || exit 1
            fi
            echo "Attempt $attempts failed; sleeping $((attempts * 10))s before retry..."
            sleep $((attempts * 10))
          done

      - name: Upload debug APKs (if any)
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: |
            **/build/outputs/**/*.apk

      - name: Upload Gradle logs (always)
        if: always()
        run: |
          echo "Collecting Gradle logs (if present)..."
          find . -type f -name "*.log" -maxdepth 6 -print || true

# Android CI - pre-download Gradle distribution, patch wrapper to local file:// zip so the wrapper won't re-download,
# find the gradle wrapper anywhere, run build from its directory, and upload artifacts.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle & Maven
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show repo layout (debug)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "Find gradle-wrapper.properties and gradlew (if present):"
          find . -maxdepth 6 -type f -name gradle-wrapper.properties -print || true
          find . -maxdepth 6 -type f -name gradlew -print || true

      - name: Pre-download Gradle distribution (download to /tmp and unpack)
        run: |
          set -euo pipefail
          # Prefer a secret-hosted distribution URL if provided (recommended)
          if [ -n "${{ secrets.GRADLE_DIST_URL || '' }}" ]; then
            DIST_URL="${{ secrets.GRADLE_DIST_URL }}"
            echo "Using GRADLE_DIST_URL from secrets: $DIST_URL"
          else
            WRAPPER_PROPS=$(find . -type f -name gradle-wrapper.properties | head -n 1 || true)
            if [ -z "$WRAPPER_PROPS" ]; then
              echo "No gradle-wrapper.properties found; skipping pre-download (wrapper will attempt download)."
              exit 0
            fi
            DIST_URL=$(grep -E '^distributionUrl=' "$WRAPPER_PROPS" | cut -d= -f2-)
            if [ -z "$DIST_URL" ]; then
              echo "distributionUrl not found in $WRAPPER_PROPS; skipping pre-download."
              exit 0
            fi
            # prefer the direct downloads.gradle.org CDN to avoid services.gradle.org redirect timeouts
            DIST_URL=${DIST_URL/services.gradle.org/downloads.gradle.org}
            echo "Using distributionUrl from wrapper: $DIST_URL"
          fi

          DIST_NAME=$(basename "$DIST_URL")
          TMP_ZIP="/tmp/${DIST_NAME}"
          echo "Downloading $DIST_URL to $TMP_ZIP"

          # robust curl with connect timeout, long total time, and retries
          curl -fL --connect-timeout 30 --max-time 1200 --retry 8 --retry-delay 10 -o "$TMP_ZIP" "$DIST_URL"

          echo "Computing SHA256 for zip to create deterministic wrapper cache subdir..."
          ZIP_SHA=$(sha256sum "$TMP_ZIP" | awk '{print $1}')
          BASE_NAME=${DIST_NAME%.zip}   # e.g. gradle-9.5.0-bin
          GRADLE_USER_HOME="${HOME}/.gradle"
          DEST_DIR="$GRADLE_USER_HOME/wrapper/dists/$BASE_NAME/$ZIP_SHA"
          mkdir -p "$DEST_DIR"
          echo "Unpacking $TMP_ZIP -> $DEST_DIR"
          unzip -q "$TMP_ZIP" -d "$DEST_DIR" || true
          echo "Unpacked. Contents:"
          ls -la "$DEST_DIR" || true

      - name: Patch wrapper to local file and verify
        run: |
          set -euo pipefail

          TMP_ZIP="/tmp/$(basename "${{ secrets.GRADLE_DIST_URL || '' }}" || true)"
          # If secret wasn't set, fall back to the file downloaded earlier by extracting name from wrapper (if any).
          if [ ! -f "$TMP_ZIP" ]; then
            # Determine TMP_ZIP by finding the tmp file created earlier (pattern)
            # We expect /tmp/gradle-*-bin.zip created by Pre-download; pick the newest matching file.
            TMP_ZIP=$(ls -1t /tmp/gradle-*-bin.zip 2>/dev/null | head -n1 || true)
          fi

          if [ -z "$TMP_ZIP" ] || [ ! -f "$TMP_ZIP" ]; then
            echo "Expected gradle zip in /tmp but none found; aborting patch step."
            exit 1
          fi

          echo "Using local zip: $TMP_ZIP"

          # Find gradlew and its directory
          GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1 || true)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found in repository; nothing to patch."
            exit 0
          fi
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          echo "gradlew found at: $GRADLEW_PATH (dir: $GRADLEW_DIR)"

          # Prefer gradle/wrapper/gradle-wrapper.properties located relative to gradlew
          WRAPPER_PROPS="$GRADLEW_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER_PROPS" ]; then
            WRAPPER_PROPS=$(find "$GRADLEW_DIR" -maxdepth 6 -type f -name gradle-wrapper.properties | head -n 1 || true)
          fi
          if [ -z "$WRAPPER_PROPS" ]; then
            # fallback: search repo
            WRAPPER_PROPS=$(find . -type f -name gradle-wrapper.properties | head -n 1 || true)
          fi

          if [ -z "$WRAPPER_PROPS" ]; then
            echo "No gradle-wrapper.properties found to patch; the wrapper will try to download. Exiting."
            exit 1
          fi

          echo "Patching wrapper properties at: $WRAPPER_PROPS"

          NEW_LINE="distributionUrl=file://$TMP_ZIP"
          # Replace or append distributionUrl in workspace copy of wrapper properties
          awk -v new="$NEW_LINE" 'BEGIN{changed=0} /^distributionUrl=/ {print new; changed=1; next} {print} END{if(changed==0) print new}' "$WRAPPER_PROPS" > "$WRAPPER_PROPS.tmp" && mv "$WRAPPER_PROPS.tmp" "$WRAPPER_PROPS"

          echo "Patched distributionUrl (workspace):"
          grep -E '^distributionUrl=' "$WRAPPER_PROPS" || true

          # Make gradlew executable and verify wrapper chooses local file
          chmod +x "$GRADLEW_PATH"
          cd "$GRADLEW_DIR"
          echo "Running './gradlew --version' to force the wrapper to use the local zip..."
          ./gradlew --no-daemon --version --warning-mode=all

      - name: Find gradlew, make executable and run build (with retries)
        run: |
          set -euo pipefail
          GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1 || true)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found in repository. Please commit gradlew, gradlew.bat and gradle/wrapper/*."
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLEW_DIR"
          attempts=0
          max_attempts=3
          until [ $attempts -ge $max_attempts ]
          do
            attempts=$((attempts+1))
            echo "Build attempt $attempts/$max_attempts..."
            if [ $attempts -lt $max_attempts ]; then
              ./gradlew --no-daemon assembleDebug --warning-mode=all && break || true
            else
              echo "Final attempt: running with --stacktrace and --info for diagnostics"
              ./gradlew --no-daemon assembleDebug --stacktrace --info || exit 1
            fi
            echo "Attempt $attempts failed; sleeping $((attempts * 10))s before retry..."
            sleep $((attempts * 10))
          done

      - name: Upload debug APKs (if any)
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: |
            **/build/outputs/**/*.apk

      - name: Upload Gradle logs (always)
        if: always()
        run: |
          echo "Collecting Gradle logs (if present)..."
          find . -type f -name "*.log" -maxdepth 6 -print || true
